openapi: 3.0.0
info:
  title: GIH API
  description: GIH API with autogenerated swagger doc

# components:
#   securitySchemes:
# BasicAuth:
#   type: http
#   scheme: basic
# ApiKeyAuth:
#   type: apiKey
#   in: header
#   name: X-API-Key
# BearerAuth:
#   type: http
#   scheme: bearer
#   description: >-
#     Enter the token with the `Bearer: ` prefix, e.g. "Bearer abcde12345".

paths:
  /api/login:
    post:
      summary: Sign in a user.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                remember:
                  type: boolean
                  value: false
              required:
                - username
                - password
                - remember
      responses:
        '200':
          description: A JSON array of user names

  /api/logout:
    get:
      tags:
        - Authentication
      summary: Sign out a user.
      responses:
        '200':
          description: A JSON array

  /api/is-auth:
    get:
      tags:
        - Authentication
      summary: Check if user authenticated.
      responses:
        '200':
          description: A JSON array

  /api/is-admin:
    get:
      tags:
        - Authentication
      summary: Check if user is admin.
      responses:
        '200':
          description: A JSON array

  /api/is-hospital-admin:
    get:
      tags:
        - Authentication
      summary: Check if user is hospital or admin.
      responses:
        '200':
          description: A JSON array

  /api/is-superUser-admin':
    get:
      tags:
        - Authentication
      summary: Check if user is superUser or admin.
      responses:
        '200':
          description: A JSON array

  /api/is-auth-userid/{userid}:
    get:
      tags:
        - Authentication
      summary: Check if user authenticated with User ID.
      parameters:
        - name: userid
          in: path
          required: true
          type: string
          description: User ID
          schema:
            example: 1
      responses:
        '200':
          description: A JSON array

  /api/reset-password:
    put:
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id:
                  type: string
                  example: 102
                username:
                  type: string
                  example: test
                newPassword:
                  type: string
                  example: Test@123
                confirmPassword:
                  type: string
                  example: Test@123
              required:
                - id
                - username
                - newPassword
                - confirmPassword
      summary: Reset password.
      responses:
        '200':
          description: A JSON array

  /api/change-password:
    put:
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                password:
                  type: string
                  example: oldPassword
                newPassword:
                  type: string
                  example: Test@123
                confirmPassword:
                  type: string
                  example: Test@123
              required:
                - password
                - newPassword
                - confirmPassword
      summary: Change password.
      responses:
        '200':
          description: A JSON array

  /api/forget-password:
    post:
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: ekarat
                email:
                  type: string
                  example: ekarat@gpo.or.th
              required:
                - username
                - email
      summary: forget password send token to email
      responses:
        '200':
          description: A JSON array

  /api/forget-password-token-check:
    get:
      tags:
        - Authentication
      parameters:
        - in: query
          name: token
          schema:
            type: string
          required: true
      summary: Forget password token check
      responses:
        '200':
          description: A JSON array

  /api/sap-products-list:
    get:
      tags:
        - List
      parameters:
        - in: query
          name: q
          schema:
            type: string
          example: 'ALBENDAZOLE'
          allowEmptyValue: true
      summary: Get list of products.
      responses:
        '200':
          description: A JSON array
